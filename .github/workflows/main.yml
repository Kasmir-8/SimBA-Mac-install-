name: macOS (Intel) SimBA install test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-macos-intel:
    runs-on: macos-13

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install FFmpeg (Homebrew)
        run: |
          brew update
          brew install ffmpeg
          ffmpeg -version

      - name: Install Anaconda (x86_64)
        shell: bash
        run: |
          set -euo pipefail
          # Pick a current Anaconda installer for Intel macOS.
          # If this exact version ever 404s, swap it for a newer one from repo.anaconda.com/archive/.
          curl -L -o Anaconda3.sh https://repo.anaconda.com/archive/Anaconda3-2024.10-1-MacOSX-x86_64.sh
          bash Anaconda3.sh -b -p "$HOME/anaconda3"
          echo "$HOME/anaconda3/bin" >> $GITHUB_PATH

      - name: Create Python 3.6 env (conda-forge)
        shell: bash
        run: |
          set -euo pipefail
          conda --version
          conda config --set always_yes yes
          conda config --add channels conda-forge
          conda config --set channel_priority strict

          conda create -n simba python=3.6
          source "$HOME/anaconda3/bin/activate" simba
          python --version

      - name: Install SimBA
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/anaconda3/bin/activate" simba
          python -m pip install --upgrade pip
          pip install simba-uw-tf-dev

      - name: Import test
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/anaconda3/bin/activate" simba
          python -c "import simba; print('SimBA import OK')"
