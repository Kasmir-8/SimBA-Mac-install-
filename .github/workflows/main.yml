name: macOS SimBA install test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Homebrew is already available on GitHub macOS runners,
      # but we update + install ffmpeg to match what users do.
      - name: Install FFmpeg (Homebrew)
        run: |
          brew update
          brew install ffmpeg
          ffmpeg -version

      # Install Miniconda + create a Python 3.6 environment
      - name: Set up Miniconda (Python 3.6 env)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"
          auto-update-conda: true
          activate-environment: simba
          python-version: "3.6"

      - name: Show Python + Conda info
        shell: bash -l {0}
        run: |
          which python
          python --version
          conda info

      # Install SimBA in that environment
      - name: Install SimBA
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          pip install simba-uw-tf-dev

      # Minimal verification test
      - name: Import test
        shell: bash -l {0}
        run: |
          python -c "import simba; print('SimBA import OK')"
